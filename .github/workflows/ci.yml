name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ats
          POSTGRES_PASSWORD: ats
          POSTGRES_DB: ats
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
      rabbitmq:
        image: rabbitmq:4
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://ats:ats@localhost:5432/ats
      JWT_SECRET_KEY: ci-not-a-real-secret-ci-not-a-real-secret
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: ci
      MINIO_SECRET_KEY: ci
      MINIO_BUCKET: resumes
      REDIS_URL: redis://localhost:6379/0
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Tests (unit + integration)
        # Integration tests self-skip if Postgres is unreachable; here it is up,
        # so they run.
        run: uv run pytest -q

  airflow-dag-validation:
    runs-on: ubuntu-latest
    # Deliberately its own job, no dependency on lint/test's Postgres/Redis/
    # RabbitMQ services or on this repo's own uv environment — Airflow must
    # never become a dependency of the FastAPI app (decision 2b/2d,
    # docs/plans/rabbitmq-airflow-migration.md). Runs the DAG import/shape
    # check inside a real Airflow image, same command verified manually
    # while building this migration (see that plan's "What's remaining").
    steps:
      - uses: actions/checkout@v4
      - name: Validate assessment_sweep_dag.py against a real Airflow install
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/airflow/dags:/opt/airflow/dags:ro" \
            -v "${{ github.workspace }}/airflow/validate_dags.py:/opt/airflow/validate_dags.py:ro" \
            -e _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-ssh \
            apache/airflow:3.2.0-python3.12 \
            bash -c "python /opt/airflow/validate_dags.py"
