name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Tests
        # The unit suite needs no services, but it does load config.
        env:
          DATABASE_URL: postgresql+psycopg://ats:ats@localhost:5432/ats
          JWT_SECRET_KEY: ci-not-a-real-secret-ci-not-a-real-secret
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: ci
          MINIO_SECRET_KEY: ci
          MINIO_BUCKET: resumes
          REDIS_URL: redis://localhost:6379/0
        run: uv run pytest -q
